name: Publish to s2script registry

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-s2s-hide
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check release version
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (pkg.private) throw new Error('Remove private before publishing.');
          if (process.env.GITHUB_REF_TYPE === 'tag') {
            if (process.env.GITHUB_REF_NAME !== `v${pkg.version}`) {
              throw new Error(`Tag must match package.json: v${pkg.version}`);
            }
          } else if (process.env.GITHUB_REF !== 'refs/heads/main') {
            throw new Error('Select main or a matching version tag for a manual publish.');
          }
          console.log(`Publishing ${pkg.name}@${pkg.version}`);
          NODE
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run package
      - name: Inspect registry source package
        run: npm run registry:pack
      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: s2s-hide-${{ github.sha }}
          path: |
            dist/*.s2sp
            dist/*.zip
          if-no-files-found: error
          retention-days: 30
      - name: Publish plugin and source to s2script
        env:
          S2SCRIPT_TOKEN: ${{ secrets.S2SCRIPT_TOKEN }}
        run: |
          if [ -z "$S2SCRIPT_TOKEN" ]; then
            echo '::error::Add S2SCRIPT_TOKEN under Settings > Secrets and variables > Actions > Secrets, then rerun this workflow.'
            exit 1
          fi
          npm run deploy
